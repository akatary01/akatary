<html>
<head>
    <title>akatary</title>
    <link rel="icon" href="assets/favicon.ico" />

    <link rel="stylesheet" href="assets/css/art.css">
    <link rel="stylesheet" href="assets/css/book.css">
    <link rel="stylesheet" href="assets/css/utils.css">
    <link rel="stylesheet" href="assets/css/vars/_theme.css">
    <link rel="stylesheet" href="assets/css/vars/_fonts.css">

    <link rel="apple-touch-icon" href="assets/apple.png" />
    <script src="https://kit.fontawesome.com/51acc43a61.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Barrio&display=swap" rel="stylesheet">
</head>
<body class="flex justify-center">  
<div id="root">
   <nav></nav>
   <main class="flex justify-between align-center width-100" style="height: 100%">
        <!-- left art gallery -->
        <div class="gallery">
            <ak-drawing 
                class="drawing-container"
                x-data="{ pinColor: 'orange', containerProps: { transform: 'rotate(5deg)' }, height: '35%', src: 'assets/drawings/0.png' }"
            ></ak-drawing>
            <ak-drawing 
                class="drawing-container"
                x-data="{ pinColor: '#39cbb9', containerProps: { transform: 'rotate(0deg)' }, height: '20%', src: 'assets/drawings/5.png' }"
            ></ak-drawing>
        </div>

        <!-- book -->
        <div 
            id="book" 
            class="flex align-center justify-center" 
            style="width: 780px; height: 510px;"
        >
            <!-- navigation -->
            <div class="flex column align-center width-100 height-100">
                <nav
                    style="margin-top: -33px;"
                    class="flex align-self-start width-100"
                    x-data="{ sections: SECTIONS }"
                >
                    <a 
                        href="#"
                        id="closeCover"
                        onclick="Section.select(COVER_ID)" 
                        :class="Section.isSelected(COVER_ID) ? 'active' : ''"
                        style="width: 19.5px; padding: 0; background: url('assets/book-bg-4k.png');"
                    ></a>
                    <template x-for="section in sections">
                        <a 
			                :id="section"
                            :href="'#'+section" 
                            onclick="Section.select(event.target.href.split('#').at(-1))" 
                            :class="Section.isSelected(section) ? 'active' : ''"
                            class="no-underline"
                            x-text="section.charAt(0).toUpperCase() + section.slice(1)"
                        ></a>
                    </template>
                </nav>
                <div id="page" class="page" style="width: 95%; height: 100%; margin: 0 0 -20px 0; overflow: scroll;">
                </div>
            </div>

            <!-- content -->
            <div
                id="cover" 
                class="absolute" 
                style="width: 780px; height: 510px; margin: 20px 0 0 -20px; font-family: var(--cover-font-family);"
            >
                <!-- intro -->
                <div>
                    <div class="absolute">
                        <img src="assets/stickers/mit.png" style="height: 150px; margin: 20px;"/>
                    </div>
                    <div class="absolute" style="right: 0;">
                        <img src="assets/stickers/google.png" style="height: 90px; margin: 50px;"/>
                    </div>
                    <div id="intro" class="flex column align-center justify-center height-100">
                        <p style="font-size: var(--font-size-title-large);">I Am</p>
                        <p style="font-size: var(--font-size-headline-xxlarge); margin-top: 0; color: var(--bg-primary);">Ahmed Katary</p>
                        <p style="font-size: var(--font-size-headline-large); color: var(--success)">Computer Scientist</p>
                        <p style="font-size: var(--font-size-headline-large); color: var(--primary)">Entrepreneur</p>
                        <p style="font-size: var(--font-size-headline-large); color: var(--secondary)">Artist</p>
                        <br/>
                        <p style="font-size: var(--font-size-headline-large);">Welcome to my slice of the web!</p>
                        <a 
                            class="underline"
                            download="akatary_resume.pdf"
                            href="assets/akatary_resume.pdf"
                            style="font-family: var(--font-family);" 
                        >
                            Download resume (pdf)
                        </a>
                        <div 
                            x-data="{ items: [] }" 
                            x-init="(async () => { items = await (await fetch('assets/data/links.json')).json(); })()"
                            style="margin: 20px 0 -20px 0;"
                        >
                            <template x-for="item in items" :key="item.href">
                                <a :href="item.href" class="icon-button-no-hover no-underline">
                                    <i :class="item.icon" style="font-size: var(--font-size-headline-large); color: var(--bg-primary)"></i>
                                </a>  
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- right art gallery -->
        <div class="gallery">
            <ak-drawing 
                class="drawing-container"
                x-data="{ pinColor: '#39cbb9', containerProps: { transform: 'rotate(-5deg)' }, height: '20%', src: 'assets/drawings/1.png' }"
            ></ak-drawing>
            <ak-drawing 
                class="drawing-container"
                x-data="{ pinColor: '#39cbb9', containerProps: { transform: 'rotate(0deg)' }, height: '22%', src: 'assets/drawings/4.png' }"
            ></ak-drawing>
            <ak-drawing 
                class="drawing-container"
                x-data="{ pinColor: '#39cbb9', containerProps: { transform: 'rotate(3deg)' }, height: '30%', src: 'assets/drawings/2.png' }"
            ></ak-drawing>
        </div>

        <!-- templates -->
        <template id="ak-drawing-template" :style="{ ...containerProps }">
            <div 
                class="drawing width-100" 
                :style="{ ...containerProps }"
            >
                <i class="fa-solid fa-circle pin absolute circle shadow" :style="{ color: pinColor, height: height }"></i>
                <img :src="src" class="width-100"/>
            </div>
        </template>

        <template id="ak-entry-template" :style="{ ...containerProps }">
            <div 
                class="entry flex column width-100" 
                :style="{ ...containerProps, alignItems: position, height: '150px' }"
            >
                <div class="flex height-100" :style="{ flexDirection: position === 'start' ? 'row' : 'row-reverse', height: '75%' }">
                    <span class="entry-img-container flex align-center justify-center" style="margin: 0 10px;">
                        <img :src="src" style="height: 80%;"/>
                    </span>
                    <div 
                        style="margin: 0 10px;" 
                        class="content flex column height-100" 
                        :style="{alignItems: position, textAlign: position}"
                    >
                        <span class="flex align-center">
                            <h1 x-text="title" style="margin: 0 0 10px 0;"></h1>
                            <a :href="href" class="no-underline" style="margin-left: 10px; margin-top: -7px;" x-show="href">
                                <i :class="`fa-solid ${icon? icon : 'fa-arrow-up-right-from-square'}`"></i>
                            </a>
                        </span>
                        <h2 x-text="description" style="margin: 0;"></h2>
                    </div>
                </div>
                <span class="flex align-center" :style="{ flexDirection: position === 'start' ? 'row' : 'row-reverse', margin: '5px 8px' }">
                    <p x-show="!active" class="entry-label __status" style="background-color: #AA4A44;"></p>
                    <p x-show="active" class="entry-label __status" style="background-color: #39cbb9;"></p>
                    <template x-for="label in labels">
                        <p x-text="label" class="entry-label"></p>
                    </template>
                </span>
            </div>
        </template>
    </main>
    <script src="akatary.js"></script>
</body>
</html>
